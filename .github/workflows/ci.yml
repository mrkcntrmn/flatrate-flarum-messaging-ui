name: CI

on:
  push:
    branches: [main, 'feat/**', 'ci/**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            lane: f1
          - php: '8.4'
            lane: f2
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: curl, dom, mbstring, openssl, pdo, tokenizer, xml, xmlwriter, zip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Composer validate
        run: composer validate --no-check-publish --strict

      # Composer 2.10 blocks league/flysystem 1.x, which Flarum 1.8.19 requires.
      # Ignore only those advisory IDs so the existing 1.8.19 lock can install.
      # Exception stays on the Flarum 1 lane only.
      - name: Allow Flarum 1.8.19 flysystem advisories
        if: matrix.lane == 'f1'
        run: composer config --global --json policy.advisories.ignore-id '["PKSA-w9tt-7782-78jx","PKSA-pwh8-d4fr-nywn"]'

      - name: Install PHP dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Assert resolved Flarum core
        run: |
          if [ "${{ matrix.lane }}" = "f2" ]; then
            composer show flarum/core | grep -E '^versions\s+:\s+\* v2\.0\.2$'
            composer show league/flysystem | grep -E '^versions\s+:\s+\* 3\.'
          else
            composer show flarum/core | grep -E '^versions\s+:\s+\* v1\.8\.'
          fi

      - name: PHP syntax check
        run: |
          find src tests extend.php extend-f2.php -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

      - name: JS install
        working-directory: js
        run: npm ci

      - name: JS tests
        working-directory: js
        run: npm test

      - name: Production build
        working-directory: js
        run: npm run build

      - name: Tracked production JS assets must match build
        run: |
          if ! git diff --exit-code -- js/dist; then
            echo "Tracked JS production assets are stale."
            echo "Run \`cd js && npm ci && npm run build\`, commit js/dist, and retry."
            exit 1
          fi

  flarum-f2-http:
    name: Flarum 2.0.2 messaging-ui HTTP
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml, xmlwriter, zip
      - name: Disposable Flarum 2 HTTP acceptance
        run: bash scripts/ci-flarum-f2-http.sh

  flarum-f2-messaging-browser:
    name: Flarum 2.0.2 combined Messaging Chromium
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-local
          MARIADB_DATABASE: flarum_messaging_browser_f2
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned Direct Messages provider
        uses: actions/checkout@v4
        with:
          repository: mrkcntrmn/flatrate-flarum-private-messages-bridge
          ref: 38281d9bd861f0c3a939693db4aa1e3da26eff88
          path: .pins/dm

      - name: Checkout pinned Live Chat provider
        uses: actions/checkout@v4
        with:
          repository: mrkcntrmn/flatrate-flarum-live-chat
          ref: b048f30a6bdef3e8bb1d29ded9ebd1975688603c
          path: .pins/live

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: curl, dom, fileinfo, gd, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, xmlwriter, zip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Combined Messaging Chromium acceptance
        env:
          COMBINED_DM_ROOT: ${{ github.workspace }}/.pins/dm
          COMBINED_LIVE_ROOT: ${{ github.workspace }}/.pins/live
          COMBINED_MESSAGING_UI_ROOT: ${{ github.workspace }}
          FLARUM_DB_HOST: 127.0.0.1
          FLARUM_DB_PORT: '3306'
          FLARUM_DB_DATABASE: flarum_messaging_browser_f2
          FLARUM_DB_USERNAME: root
          FLARUM_DB_PASSWORD: disposable-local
          BROWSER_EVIDENCE_DIR: ${{ github.workspace }}/evidence/forum-f2-messaging-browser
          KEEP_SMOKE_ROOT: '0'
          PHP_CLI_SERVER_WORKERS: '1'
        run: bash scripts/ci-flarum-f2-browser.sh

      - name: Upload messaging browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forum-f2-messaging-browser-evidence
          path: |
            evidence/forum-f2-messaging-browser/
            test-results/
          if-no-files-found: ignore
